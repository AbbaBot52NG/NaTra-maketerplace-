<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NaTra Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="logo">NaTra</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Sell</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>Welcome to NaTra Marketplace</h1>
    <p>Buy. Sell. Connect — Everything in one place.</p>
    <button onclick="showMessage()">Start Shopping</button>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <h2>Categories</h2>
    <div class="grid">
      <div class="card">Phones</div>
      <div class="card">Fashion</div>
      <div class="card">Electronics</div>
      <div class="card">Vehicles</div>
      <div class="card">Home Items</div>
      <div class="card">Digital Products</div>
    </div>
  </section>

  <footer>
    <p>© 2026 NaTra Marketplace. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
